name: Archicad add-on

# The add-on is built here and nowhere else.
#
# Not a convenience. Compiling an Archicad add-on needs Visual Studio with the
# v142 toolset, and the workstations this tool runs on have no administrator
# rights, so nobody in the office can install one. A runner can. The output is
# a single .apx a colleague drops into an add-on folder, which needs no rights
# at all. It carries Tapir's commands built in (archicad-addon/Tapir), so it is
# the only add-on a workstation needs.
#
# One add-on per Archicad version, 26 to 30: an .apx is compiled against one
# major version and loads in no other. The recipe is Tapir's, which builds the
# same versions the same way: a windows-2022 runner, each version's kit from
# Graphisoft's public releases, and v142 rather than the runner's own v143 up
# to 28 -- those kits predate v143 and do not compile cleanly under it -- with
# v143 from 29, whose kits are C++20 and need it.
#
# The second job makes the handover: every version's add-on beside
# Loriini.exe, with an install note and the licence, uploaded as the
# Loriini_Win artifact. That folder is what a colleague downloads; see the job
# for when it runs.

on:
  push:
    paths:
      - "archicad-addon/**"
      - ".github/workflows/archicad-addon.yml"
      # How the folder is made, so a change to that is proved by making one.
      - "Loriini.spec"
      - "scripts/build_app.py"
      # What the .exe wears, carved into it at build time.
      - "assets/loriini.ico"
      - "assets/loriini-wordmark.png"
  pull_request:
    paths:
      - "archicad-addon/**"
      - ".github/workflows/archicad-addon.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archicad ${{ matrix.archicad }} / Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # A new Archicad is a line here, its kit's release from
          # github.com/GRAPHISOFT/archicad-api-devkit, and a line in
          # ARCHICAD_VERSIONS (src/sun_study/__init__.py) -- plus whatever
          # the compiler finds that Src/ApiCompat.hpp has to learn.
          - archicad: 26
            devkit: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/26.3000/API.Development.Kit.WIN.26.3000.zip
            toolset: v142
          - archicad: 27
            devkit: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/27.3001/API.Development.Kit.WIN.27.3001.zip
            toolset: v142
          - archicad: 28
            devkit: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/28.3001/API.Development.Kit.WIN.28.3001.zip
            toolset: v142
          - archicad: 29
            devkit: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/29.3000/API.Development.Kit.WIN.29.3000.zip
            toolset: v143
          - archicad: 30
            devkit: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/30.3000/API.Development.Kit.WIN.30.3000.zip
            toolset: v143

    steps:
      - uses: actions/checkout@v4

      - name: Download the API Development Kit
        run: python archicad-addon/Tools/download_and_unzip.py ${{ matrix.devkit }} archicad-addon/Build/DevKit

      - name: Generate the project
        run: >
          cmake -B archicad-addon/Build
          -G "Visual Studio 17 2022" -A x64 -T ${{ matrix.toolset }}
          -DAC_VERSION=${{ matrix.archicad }}
          -DAC_API_DEVKIT_DIR=archicad-addon/Build/DevKit
          archicad-addon

      # Kept, not streamed, so the step after this one can read it back.
      # `tee` keeps the live log intact for anybody watching the run.
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build archicad-addon/Build --config RelWithDebInfo 2>&1 | tee build.log

      # A failed compile is only useful if somebody can read it, and a run's
      # log needs admin rights on the repository. Annotations do not, and they
      # show on the run's own summary page, so the first errors are visible to
      # whoever is fixing them without anybody being granted anything.
      - name: Say what failed
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '## Compiler errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -oE '[^ ]+\.(cpp|hpp|h)\([0-9]+,?[0-9]*\) ?: (error|fatal error) [^[]*' build.log \
            | sort -u | head -40 | tee -a "$GITHUB_STEP_SUMMARY" \
            | while IFS= read -r line; do echo "::error::$line"; done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-AC${{ matrix.archicad }}
          path: build.log
          if-no-files-found: ignore

      # A build that succeeds is not the same as an add-on Archicad will open,
      # and the gap between them cost an install and a restart to discover.
      # The MDID resource is the add-on's identity: without it Archicad rejects
      # the file outright as not an add-on, and the resource compiler is
      # perfectly happy to produce a binary without one.
      #
      # The Developer ID sits in the resource as its four bytes, which are
      # printable ASCII -- the portal shows the same number as "9om/" beside
      # it. So finding those bytes in the .apx proves the resource survived
      # into the binary. Both orders are accepted because the byte order is
      # the resource compiler's business, not ours.
      - name: Check the add-on carries its identifier
        shell: bash
        run: |
          set -euo pipefail
          apx="archicad-addon/Build/RelWithDebInfo/LoriiniAddOn_AC${{ matrix.archicad }}_Win.apx"
          developer=$(sed -n 's/^[[:space:]]*\([0-9]\{6,\}\)[[:space:]]*$/\1/p' \
                      archicad-addon/RFIX/LoriiniAddOnFix.grc | head -1)
          echo "Developer ID in the resource: $developer"
          signature=$(printf "$(printf '\\x%02x\\x%02x\\x%02x\\x%02x' \
                      $((developer >> 24 & 255)) $((developer >> 16 & 255)) \
                      $((developer >> 8 & 255)) $((developer & 255)))")
          reversed=$(printf "$(printf '\\x%02x\\x%02x\\x%02x\\x%02x' \
                      $((developer & 255)) $((developer >> 8 & 255)) \
                      $((developer >> 16 & 255)) $((developer >> 24 & 255)))")
          if grep -qa -e "$signature" -e "$reversed" "$apx"; then
            echo "MDID present."
          else
            echo "::error::The built .apx does not contain the MDID developer id $developer."
            echo "Archicad will refuse this file as not an add-on."
            exit 1
          fi

      - name: Upload the add-on
        uses: actions/upload-artifact@v4
        with:
          name: LoriiniAddOn_AC${{ matrix.archicad }}_Win
          path: archicad-addon/Build/RelWithDebInfo/LoriiniAddOn_AC${{ matrix.archicad }}_Win.apx
          if-no-files-found: error

  # The folder a colleague downloads: every version's add-on above and the
  # program beside them, built from the same commit, with the install note and
  # the licence -- the Loriini_Win artifact on the run's page. Only when every
  # version built: a folder missing one would look whole and not be. scripts/build_app.py
  # makes it here exactly as it does on a PC, so the two cannot drift apart.
  #
  # Not on a pull request, whose push has already built the same commit. And
  # not on every push: the repository is private, a Windows minute is billed
  # as two, and the program takes several. A push that changes the add-on or
  # the build makes a folder; for any other branch or commit, Run workflow on
  # the Actions tab, with the branch picked, makes a fresh one.
  package:
    name: Loriini for Windows
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The Python the CI runs the window's tests on, so the program in the
      # folder is the one those tests passed.
      - name: Install the project
        run: uv sync --python 3.12

      - name: Take the add-ons built above
        uses: actions/download-artifact@v4
        with:
          pattern: LoriiniAddOn_AC*_Win
          merge-multiple: true
          path: addon

      - name: Build the program and gather the folder
        shell: bash
        run: |
          set -euo pipefail
          addons=()
          for apx in addon/LoriiniAddOn_AC*_Win.apx; do addons+=(--addon "$apx"); done
          uv run python scripts/build_app.py "${addons[@]}"

      # A build that succeeds is not yet a program that starts: a module the
      # scan missed fails only when something imports it. So it is started
      # once the way the window starts a study -- SUN_STUDY_RUN_CLI set, so it
      # runs a command and opens no window -- and must list the rulesets,
      # which it can only do with its own data inside it.
      - name: Check the program starts
        shell: bash
        timeout-minutes: 5
        env:
          SUN_STUDY_RUN_CLI: "1"
        run: |
          set -u
          if ./dist/Loriini.exe rulesets > rulesets.txt 2> errors.txt \
             && grep -q "nsw_adg@" rulesets.txt; then
            cat rulesets.txt
          else
            cat rulesets.txt errors.txt
            echo "::error::The packaged program did not start and list its rulesets."
            exit 1
          fi

      - name: Upload the folder
        uses: actions/upload-artifact@v4
        with:
          name: Loriini_Win
          path: dist/
          if-no-files-found: error
