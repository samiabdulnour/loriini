# The licence service on Fly.io (docs/licence-service.md). Change `app` to a
# name of your own; everything secret is set with `fly secrets set`, never here.
app = "loriini-licences"
primary_region = "syd"

[env]
  PORT = "8080"
  LORIINI_DATABASE = "/data/licences.sqlite3"

# The database lives on a volume, so it outlasts every deploy and restart.
[[mounts]]
  source = "licences"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stopped when idle and started by the next request: leases run a fortnight,
  # so a second's start now and then is never felt.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "60s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
