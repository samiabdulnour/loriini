# The Loriini website on Fly.io (docs/website.md). Static pages and the
# current build's download, nothing else; no volume, no secrets.
app = "loriini-site"
primary_region = "syd"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "60s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
