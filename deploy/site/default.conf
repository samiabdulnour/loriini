# nginx for the Loriini site: plain files, clean addresses (/terms serves
# terms.html), long caching for the download, none for the pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The build was Loriini_AC26_Win.zip until 31 October 2026, when the folder
    # started carrying one add-on per Archicad version and took the workflow's
    # name for it. The old address is in the licence service's recall notice
    # and in mail already sent, so it keeps working.
    location = /download/Loriini_AC26_Win.zip {
        return 301 /download/Loriini_Win.zip;
    }

    location /download/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
