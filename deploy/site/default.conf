# nginx for the Loriini site: plain files, clean addresses (/terms serves
# terms.html), long caching for the download, none for the pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /download/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The Windows build's old name, from when it held the Archicad 26 add-on
    # alone; links to it, the licence service's among them, get the folder.
    location = /download/Loriini_AC26_Win.zip {
        return 301 /download/Loriini_Win.zip;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
