<!-- The front is only the picture: the name and the lorikeet, the sun
     throwing their shadows. Everything said in words lives on its own page,
     one per tab above. -->
<main class="wrap front">

  <div class="picture">
    <canvas id="picture" role="img" aria-label="LORIINI in coloured pixel letters and a pixel lorikeet beside it, facing the word, under a sky coloured as a heatmap of the sun; the sun follows the pointer and their shadows turn and stretch on the ground"></canvas>

<script>
/* The front's picture: LORIINI in pixel letters, one colour of the lorikeet
   to each, the lorikeet beside it, and the sun throwing their shadows on the
   ground in front of them. The scene is drawn at one pixel per cell and each
   pixel scaled up whole, edge to edge, to a sharp edge all round.

   The sky is a heatmap of the sun, in bands from the sun outwards, uneven
   and drifting a little, its colours and spacing set by how high the sun
   stands: on the horizon a dusk, warm all the way out, its bands close
   together; halfway up the full heat, white through yellow, orange, red and
   magenta to blue; overhead sharp, a white sun in one thin yellow ring, the
   bands then spreading far apart into an even blue. The sun keeps to the
   day's arc on its own; the pointer takes it, always behind the letters, the
   bird and the ground, and the shadows follow it: short when it is high,
   long when it is low, thrown away from its side. */
(function () {
  var box = document.querySelector('.picture');
  var canvas = document.getElementById('picture');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var src = document.createElement('canvas');
  var sctx = src.getContext('2d');
  var obj = document.createElement('canvas');
  var octx = obj.getContext('2d', { willReadFrequently: true });
  var bird = new Image();
  bird.src = 'lorikeet.png';

  var C = { sun: '#ffd21e', core: '#ff8a1f', ray: '#fff6c8' };
  // The ground in the sun and in shade.
  var ground = [[118, 124, 112], [236, 224, 188]];

  // The letters, five cells by seven, the I three wide, coloured head to
  // tail like the lorikeet.
  var glyphs = {
    L: ['X....', 'X....', 'X....', 'X....', 'X....', 'X....', 'XXXXX'],
    O: ['.XXX.', 'X...X', 'X...X', 'X...X', 'X...X', 'X...X', '.XXX.'],
    R: ['XXXX.', 'X...X', 'X...X', 'XXXX.', 'X.X..', 'X..X.', 'X...X'],
    I: ['XXX', '.X.', '.X.', '.X.', '.X.', '.X.', 'XXX'],
    N: ['X...X', 'XX..X', 'XX..X', 'X.X.X', 'X..XX', 'X..XX', 'X...X']
  };
  var WORD = 'LORIINI';
  var INKS = ['#1846d6', '#2fd3ff', '#12a84a', '#a8e000', '#ffd21e', '#ff8a1f', '#f0301e'];
  var wordWidth = WORD.split('').reduce(function (w, ch) { return w + glyphs[ch][0].length; }, 0) + WORD.length - 1;

  // The heatmap's stops, from the sun outwards, as hue, saturation and
  // lightness, for a sun on the horizon, halfway up and overhead.
  var heat = [
    { pos: [0, .14, .30, .46, .62, .80, 1],
      hsl: [[34, 100, 72], [26, 100, 56], [12, 86, 52], [345, 64, 46], [305, 48, 32], [262, 50, 27], [248, 52, 17]] },
    { pos: [0, .12, .26, .42, .58, .76, 1],
      hsl: [[49, 100, 89], [49, 100, 58], [27, 100, 56], [4, 87, 53], [324, 69, 46], [266, 58, 42], [235, 65, 25]] },
    { pos: [0, .07, .13, .135, .32, .60, 1],
      hsl: [[52, 100, 95], [50, 100, 58], [50, 100, 58], [205, 82, 76], [210, 74, 63], [213, 64, 50], [218, 74, 38]] }
  ];
  var BANDS = 9;
  function clamp(v) { return Math.min(Math.max(v, 0), 1); }
  function hsl(c) {
    var s = c[1] / 100, l = c[2] / 100, a = s * Math.min(l, 1 - l);
    function f(n) { var k = (n + c[0] / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); }
    return [f(0), f(8), f(4)];
  }
  // Hue the short way round the wheel, so red turns to blue through magenta
  // and purple rather than through grey.
  function mixHsl(a, b, f) {
    var dh = ((b[0] - a[0] + 540) % 360) - 180;
    return [(a[0] + dh * f + 360) % 360, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  // The bands' colours for a sun at this height.
  function bandsFor(elev) {
    var e = clamp(elev) * 2, lo = heat[e < 1 ? 0 : 1], hi = heat[e < 1 ? 1 : 2], f = e < 1 ? e : e - 1;
    var pos = lo.pos.map(function (p, i) { return p + (hi.pos[i] - p) * f; });
    var col = lo.hsl.map(function (c, i) { return mixHsl(c, hi.hsl[i], f); });
    var out = [];
    for (var b = 0; b < BANDS; b++) {
      var v = b / (BANDS - 1), i = 1;
      while (i < pos.length - 1 && v > pos[i]) i++;
      out.push(hsl(mixHsl(col[i - 1], col[i], clamp((v - pos[i - 1]) / (pos[i] - pos[i - 1] || 1)))));
    }
    return out;
  }

  // Smooth noise, for the bands' and the sun's uneven edges.
  var perm = [];
  for (var i = 0; i < 256; i++) perm[i] = i;
  for (i = 255; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), sw = perm[i]; perm[i] = perm[j]; perm[j] = sw; }
  function lattice(x, y) { return perm[(perm[x & 255] + y) & 255] / 255; }
  function noise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi;
    u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
    var a = lattice(xi, yi), b = lattice(xi + 1, yi), c = lattice(xi, yi + 1), d = lattice(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // The layout, in cells. Wide, the bird stands on the ground beside the
  // word; narrow, it perches on the word's last letter at half size. Of the
  // ways that fit, the one with the largest letters on the screen is taken,
  // the bird beside the word wherever its cells can be four pixels or more.
  // The scene is centred, the sky and the ground running on round it.
  var W, H, cell, cols, rows, g, lay;
  var GROUND = .18;
  function size() {
    var r = box.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    function plan(s, beside) {
      var p = { s: s, beside: beside, full: beside, bw: beside ? 40 : 20, bh: beside ? 53 : 27 };
      p.width = 4 + wordWidth * s + (beside ? 4 + p.bw : 0) + 4;
      p.height = (beside ? Math.max(7 * s, p.bh) : 7 * s + p.bh) + 6;
      p.cell = Math.floor(Math.min(W / p.width, H * (1 - GROUND) / p.height));
      p.size = 7 * s * p.cell;
      return p;
    }
    function best(list, least) {
      return list.filter(function (p) { return p.cell >= least; })
        .sort(function (a, b) { return b.size - a.size || b.cell - a.cell; })[0];
    }
    lay = best([7, 6, 5, 4, 3].map(function (s) { return plan(s, true); }), 4) ||
          best([4, 3, 2].map(function (s) { return plan(s, false); }), 3) || plan(2, false);
    cell = Math.max(lay.cell, 2);
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
    g = rows - Math.max(3, Math.round(rows * GROUND));
    src.width = obj.width = cols; src.height = obj.height = rows;
  }

  function rect(c, x, y, w, h, colour) { c.fillStyle = colour; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  // The sun's cells: a disc with an orange core, its edge a little uneven
  // and moving, and rays, the four straight ones and the four diagonal ones
  // taking turns.
  function sunCells(sun, R, frame) {
    var list = [];
    for (var dy = -R - 1; dy <= R + 1; dy++)
      for (var dx = -R - 1; dx <= R + 1; dx++) {
        var a = Math.atan2(dy, dx), d = Math.sqrt(dx * dx + dy * dy);
        var edge = R + .3 + (noise(Math.cos(a) * 1.5 + frame * .04, Math.sin(a) * 1.5 + 7) - .5) * 2.2;
        if (d <= edge) list.push([sun.x + dx, sun.y + dy, d <= R * .5 ? C.core : C.sun]);
      }
    var straight = frame % 4 < 2;
    for (var k = 0; k < 8; k++) {
      if ((k % 2 === 0) !== straight) continue;
      var ang = k * Math.PI / 4, ux = Math.round(Math.cos(ang)), uy = Math.round(Math.sin(ang));
      for (var s = R + 3; s <= R + 4; s++) list.push([sun.x + ux * s, sun.y + uy * s, C.ray]);
    }
    return list;
  }

  // The word and the bird, on a clear layer of their own: drawn over the
  // scene, and read back as the shapes whose shadows fall on the ground.
  function figures(frame) {
    var s = lay.s, x = Math.floor((cols - lay.width) / 2) + 4;
    var top = g - 7 * s, last = 0;
    octx.clearRect(0, 0, cols, rows);
    WORD.split('').forEach(function (ch, n) {
      var gl = glyphs[ch];
      for (var gy = 0; gy < 7; gy++)
        for (var gx = 0; gx < gl[gy].length; gx++)
          if (gl[gy][gx] === 'X') rect(octx, x + gx * s, top + gy * s, s, s, INKS[n]);
      last = x;
      x += (gl[0].length + 1) * s;
    });
    // The lorikeet, turned to face the word: on the ground beside it, or
    // perched on its last letter; hopping now and then.
    if (bird.complete && bird.naturalWidth) {
      var bw = lay.bw, bh = lay.bh, feet = lay.beside ? g : top;
      var bx = lay.beside ? x - s + 4 : last + Math.round(1.5 * s) - Math.round(bw * .45);
      var by = feet - Math.round(bh * .82) - (frame % 23 < 2 ? 1 : 0);
      octx.save();
      octx.translate(bx + bw, by); octx.scale(-1, 1);
      octx.imageSmoothingEnabled = !lay.full;
      octx.drawImage(bird, 0, 0, bw, bh);
      octx.restore();
    }
    var a = octx.getImageData(0, 0, cols, rows).data, mask = new Uint8Array(cols * rows);
    for (var i = 0; i < mask.length; i++) mask[i] = a[i * 4 + 3] > 110 ? 1 : 0;
    return mask;
  }

  function draw(frame) {
    // Where the sun stands. On its own it keeps to the day's arc for the
    // hour t; as the pointer it stands where the pointer is, and the hour and
    // its height are read back from there.
    var R = Math.max(3, Math.round(rows * .045)), span = (g - R - 2) * .85, sun;
    if (!aim) {
      var e = Math.sin(Math.PI * t);
      sun = { x: Math.round(cols * (.04 + .92 * t)), y: Math.round(g - R - 1 - e * span), elev: e, hour: t };
    } else {
      var px = Math.floor(aim.x), py = Math.floor(aim.y);
      sun = { x: px, y: py, elev: clamp((g - R - 1 - py) / span), hour: clamp((px / cols - .04) / .92) };
    }

    // The sky. Low, the bands sit close together; high, the first few hug
    // the sun and the rest spread far out, the sky an even blue.
    var big = Math.max(cols, g), D = big * (.5 + .5 * sun.elev), P = 1 - .5 * sun.elev;
    var bands = bandsFor(sun.elev), fq = 4 / big, drift = frame * .015;
    var sky = sctx.createImageData(cols, g), q = sky.data;
    for (var y = 0; y < g; y++)
      for (var x = 0; x < cols; x++) {
        var v = Math.sqrt((x - sun.x) * (x - sun.x) + (y - sun.y) * (y - sun.y)) / D;
        // The noise grows with the distance, so the sun's own ring stays crisp.
        var n = noise(x * fq + drift, y * fq) * .65 + noise(x * fq * 2.3 - drift, y * fq * 2.3 + 9) * .35 - .5;
        v = v * (1 + n * .4) + n * .015;
        var b = bands[Math.min(BANDS - 1, Math.floor(Math.pow(clamp(v), P) * BANDS))], k = (y * cols + x) * 4;
        q[k] = b[0]; q[k + 1] = b[1]; q[k + 2] = b[2]; q[k + 3] = 255;
      }
    sctx.putImageData(sky, 0, 0);
    sunCells(sun, R, frame).forEach(function (c) { if (c[1] < g) rect(sctx, c[0], c[1], 1, 1, c[2]); });

    // The ground, lit, with the shadows on it. A point h cells above the
    // ground falls h * dy cells in front of the figures and h * dx across.
    var mask = figures(frame);
    var ang = .1 + sun.elev * 1.35;
    var L = Math.min(2.4, Math.cos(ang) / Math.sin(ang));
    var dy = .28 * L, dx = -(sun.hour - .5) * 1.6 * L;
    // Low sun is warmer light.
    var lit = [ground[1][0], ground[1][1] * (1 - (1 - sun.elev) * .27), ground[1][2] * (1 - (1 - sun.elev) * .55)];
    var land = sctx.createImageData(cols, rows - g), d = land.data;
    for (y = g; y < rows; y++)
      for (x = 0; x < cols; x++) {
        var h = (y - g) / dy, sx = Math.round(x - h * dx), sy = Math.round(g - h);
        var dark = sx >= 0 && sx < cols && sy >= 0 && mask[sy * cols + sx] === 1;
        var c = dark ? ground[0] : lit, j = ((y - g) * cols + x) * 4;
        d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = 255;
      }
    sctx.putImageData(land, 0, g);

    sctx.drawImage(obj, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, cols * cell, rows * cell);
  }

  var t = .3, frame = 0, aim = null, held = 0, queued = false;
  function redraw() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; draw(frame); });
  }
  // The pointer is the sun. Over the sky the pointer itself is hidden and the
  // sun shows in its place; over the ground the sun is set behind it, and the
  // pointer is a crosshair so it is not lost. A mouse keeps the sun until it
  // leaves the picture; a touch leaves it where it was put for a few seconds.
  function point(e) {
    var r = canvas.getBoundingClientRect();
    aim = { x: (e.clientX - r.left) / cell, y: (e.clientY - r.top) / cell };
    held = e.pointerType === 'touch' ? performance.now() + 4000 : Infinity;
    canvas.style.cursor = aim.y < g ? 'none' : 'crosshair';
    redraw();
  }
  // Back to its arc, carrying on from the hour it was let go at.
  function letGo() {
    if (!aim) return;
    t = clamp((Math.floor(aim.x) / cols - .04) / .92);
    aim = null;
    redraw();
  }

  size();
  window.addEventListener('resize', function () { size(); draw(frame); });
  canvas.addEventListener('pointermove', point);
  canvas.addEventListener('pointerdown', point);
  canvas.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') letGo(); });
  bird.addEventListener('load', redraw);
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    t = .35;
    draw(frame);
  } else {
    setInterval(function () {
      if (aim && performance.now() > held) letGo();
      draw(frame);
      frame++;
      if (!aim) {
        t += 1 / 220;
        if (t >= 1) t = 0;
      }
    }, 100);
  }
})();
</script>
</body>
