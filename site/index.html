<!-- The front is the name over the picture: the towers and the lorikeet
     under the sun, their shadows on the ground. Everything said in words
     lives on its own page, one per tab above. -->
<main class="wrap wide front">
  <h1 class="name">Loriini</h1>
  <p class="unseen">Sun studies from Archicad, for a NSW DA.</p>
  <div class="picture">
    <canvas id="picture" role="img" aria-label="Five black towers and a pixel lorikeet on the ground under the sun, the sky pale at sunrise, blue at noon and red at sunset; the sun follows the pointer and the shadows turn and stretch in front of them"></canvas>
  </div>
</main>

    <div><a href="mailto:hi@loriini.app">hi@loriini.app</a> · <a href="terms.html">Licence terms</a> · <a href="privacy.html">Privacy</a></div>

<script>
/* The front's picture: five black towers and the lorikeet on the ground,
   the sun crossing behind them and their shadows falling on the ground in
   front of them. The scene is drawn at one pixel per cell, the bird's own
   pixels for cells, and each pixel scaled up whole, edge to edge, to a sharp
   edge all round.

   The sky takes the hour's colour: pale at sunrise, blue at noon, red at
   sunset, with three bands of glow round the sun, a plain yellow disc, and
   its light colours the ground, the shadows and the bird a little. Every
   cell but the towers' carries a fine grain, as video does, fresh each
   frame. The sun keeps to the day's arc on its own; the pointer takes it, always behind the towers, the bird
   and the ground, and the shadows follow it: short when it is high, long
   when it is low, thrown away from its side. */
(function () {
  var box = document.querySelector('.picture');
  var canvas = document.getElementById('picture');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var src = document.createElement('canvas');
  var sctx = src.getContext('2d', { willReadFrequently: true });
  var obj = document.createElement('canvas');
  var octx = obj.getContext('2d', { willReadFrequently: true });
  var bird = new Image();
  bird.src = 'lorikeet.png';

  var C = { tower: '#000', sun: '#ffd900' };
  var GROUND = [214, 207, 147], SHADE = [184, 184, 184];
  // The sky through the day, as the hour and the sky's colour with the glow
  // nearest the sun: sunrise, noon and sunset from the design, held a while
  // each. Between them the sky passes through a pale, nearly white sky, then
  // in the evening an apricot and an orange, so each step blends two
  // neighbouring colours: no green between the yellow and the blue, no grey
  // or purple between the blue and the red.
  var DAY = [
    [0, [255, 255, 195], [255, 228, 80]],
    [.14, [255, 255, 195], [255, 228, 80]],
    [.24, [222, 237, 245], [255, 250, 225]],
    [.34, [76, 187, 236], [205, 236, 248]],
    [.66, [76, 187, 236], [205, 236, 248]],
    [.72, [224, 238, 245], [255, 252, 238]],
    [.77, [247, 214, 180], [255, 244, 215]],
    [.83, [255, 160, 95], [255, 222, 135]],
    [.89, [255, 88, 40], [255, 198, 55]],
    [1, [255, 88, 40], [255, 198, 55]]
  ];
  // How far the sky's light colours the ground, the shadows and the bird.
  var TINT = .22;

  // The scene, as shares of a frame 70 cells high and 189 wide: where the
  // sky meets the ground, where the towers and the bird stand, the towers'
  // edges and tops. A narrower picture shows the middle of it, round the bird.
  var ROWS = 70, WIDE = 189, HORIZON = .436, BASE = .78, FOCUS = .56;
  var TOWERS = [[0, .128, HORIZON], [.169, .296, .358], [.372, .45, .358], [.651, .778, .358], [.859, .987, .358]];
  var BIRD_AT = .475;

  function clamp(v) { return Math.min(Math.max(v, 0), 1); }
  function smooth(a, b, v) { v = clamp((v - a) / (b - a)); return v * v * (3 - 2 * v); }
  function mix(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
  // The sky for the hour: the three bands of glow from the sun outwards, the
  // sky itself, and the light it casts, the sky's colour at its brightest.
  function skyFor(hour) {
    var i = 1;
    while (i < DAY.length - 1 && hour > DAY[i][0]) i++;
    var a = DAY[i - 1], b = DAY[i], f = smooth(a[0], b[0], hour);
    var sky = mix(a[1], b[1], f), glow = mix(a[2], b[2], f), top = Math.max(sky[0], sky[1], sky[2]);
    return {
      bands: [0, 1, 2, 3].map(function (k) { return mix(glow, sky, k / 3).map(Math.round); }),
      light: sky.map(function (v) { return 1 - TINT + TINT * v / top; })
    };
  }
  function lit(c, light) { return [c[0] * light[0], c[1] * light[1], c[2] * light[2]]; }

  // Smooth noise, for the bands' uneven edges.
  var perm = [];
  for (var i = 0; i < 256; i++) perm[i] = i;
  for (i = 255; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), sw = perm[i]; perm[i] = perm[j]; perm[j] = sw; }
  function lattice(x, y) { return perm[(perm[x & 255] + y) & 255] / 255; }
  function noise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi;
    u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
    var a = lattice(xi, yi), b = lattice(xi + 1, yi), c = lattice(xi, yi + 1), d = lattice(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // The grain: each cell's red, green and blue shifted a little apart and
  // its brightness a little, at random, fresh each frame, as on video. The
  // towers' black stays black.
  var GRAIN = 16, GLOW = 8;
  function grain() {
    var img = sctx.getImageData(0, 0, cols, rows), d = img.data;
    for (var j = 0; j < d.length; j += 4) {
      if (d[j] + d[j + 1] + d[j + 2] === 0) continue;
      var l = (Math.random() * 2 - 1) * GLOW;
      d[j] += l + (Math.random() * 2 - 1) * GRAIN;
      d[j + 1] += l + (Math.random() * 2 - 1) * GRAIN;
      d[j + 2] += l + (Math.random() * 2 - 1) * GRAIN;
    }
    sctx.putImageData(img, 0, 0);
  }

  var W, H, cols, rows, off, hz, base;
  function size() {
    var r = box.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rows = ROWS;
    cols = Math.max(1, Math.round(W / (H / rows)));
    off = cols >= WIDE ? Math.round((WIDE - cols) / 2) : Math.min(Math.max(Math.round(FOCUS * WIDE - cols / 2), 0), WIDE - cols);
    hz = Math.round(HORIZON * rows); base = Math.round(BASE * rows);
    src.width = obj.width = cols; src.height = obj.height = rows;
  }
  function at(share) { return Math.round(share * WIDE) - off; }

  function rect(c, x, y, w, h, colour) { c.fillStyle = colour; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  // The towers and the bird, on a clear layer of their own: drawn over the
  // scene, and read back as the shapes whose shadows fall on the ground.
  function figures(frame, light) {
    octx.clearRect(0, 0, cols, rows);
    TOWERS.forEach(function (tw) {
      var x0 = at(tw[0]), x1 = at(tw[1]), top = Math.round(tw[2] * rows);
      rect(octx, x0, top, x1 - x0, base - top, C.tower);
    });
    // The lorikeet, turned to face left, its feet on the ground with the
    // towers', its tail over the shadows; hopping now and then.
    if (bird.complete && bird.naturalWidth) {
      var bw = bird.naturalWidth, bh = bird.naturalHeight, bx = at(BIRD_AT);
      var by = base - Math.round(bh * .82) - (frame % 23 < 2 ? 1 : 0);
      octx.save();
      octx.translate(bx + bw, by); octx.scale(-1, 1);
      octx.imageSmoothingEnabled = false;
      octx.drawImage(bird, 0, 0, bw, bh);
      octx.restore();
    }
    // The figures take the sky's light too: the towers stay black, the bird
    // warms at sunrise and sunset and cools a little at noon.
    var img = octx.getImageData(0, 0, cols, rows), a = img.data, mask = new Uint8Array(cols * rows);
    for (var i = 0; i < mask.length; i++) {
      mask[i] = a[i * 4 + 3] > 110 ? 1 : 0;
      a[i * 4] *= light[0]; a[i * 4 + 1] *= light[1]; a[i * 4 + 2] *= light[2];
    }
    octx.putImageData(img, 0, 0);
    return mask;
  }

  function draw(frame) {
    // Where the sun stands. On its own it keeps to the day's arc across the
    // picture for the hour t; as the pointer it stands where the pointer is,
    // and the hour and its height are read back from there.
    var R = Math.max(3, Math.round(rows * .087)), low = hz - R, span = low - R - 2, sun;
    if (!aim) {
      var e = Math.sin(Math.PI * t);
      sun = { x: Math.round(cols * (.06 + .88 * t)), y: Math.round(low - e * span), elev: e, hour: t };
    } else {
      var px = Math.floor(aim.x), py = Math.floor(aim.y);
      sun = { x: px, y: py, elev: clamp((low - py) / span), hour: clamp((px / cols - .06) / .88) };
    }

    // The sky, with its three bands of glow round the sun, closer together
    // when the sun is low.
    var day = skyFor(sun.hour), step = R * (.5 + .35 * sun.elev), fq = 3 / rows, drift = frame * .025;
    var img = sctx.createImageData(cols, hz), q = img.data;
    for (var y = 0; y < hz; y++)
      for (var x = 0; x < cols; x++) {
        var d = Math.sqrt((x - sun.x) * (x - sun.x) + (y - sun.y) * (y - sun.y));
        d *= 1 + (noise(x * fq + drift, y * fq) - .5) * .4;
        var c = day.bands[Math.min(3, Math.max(0, Math.floor((d - R) / step + 1)))], k = (y * cols + x) * 4;
        q[k] = c[0]; q[k + 1] = c[1]; q[k + 2] = c[2]; q[k + 3] = 255;
      }
    sctx.putImageData(img, 0, 0);
    // The sun, a plain yellow disc, behind the ground when it is down.
    for (var dy = -R; dy <= R; dy++)
      for (var dx = -R; dx <= R; dx++)
        if (dx * dx + dy * dy <= R * R + R * .6 && sun.y + dy < hz) rect(sctx, sun.x + dx, sun.y + dy, 1, 1, C.sun);

    // The ground, with the shadows on it. A point h cells above the ground
    // falls h * sy cells in front of the figures and h * sx across.
    var mask = figures(frame, day.light), ground = lit(GROUND, day.light), shade = lit(SHADE, day.light);
    var ang = .1 + sun.elev * 1.35;
    var L = Math.min(2.4, Math.cos(ang) / Math.sin(ang));
    var sy = .55 * L, sx = -(sun.hour - .5) * 1.6 * L;
    var land = sctx.createImageData(cols, rows - hz), g = land.data;
    for (y = hz; y < rows; y++)
      for (x = 0; x < cols; x++) {
        var dark = false;
        if (y > base) {
          var h = (y - base) / sy, mx = Math.round(x - h * sx), my = Math.round(base - h);
          dark = mx >= 0 && mx < cols && my >= 0 && mask[my * cols + mx] === 1;
        }
        var c2 = dark ? shade : ground, j = ((y - hz) * cols + x) * 4;
        g[j] = c2[0]; g[j + 1] = c2[1]; g[j + 2] = c2[2]; g[j + 3] = 255;
      }
    sctx.putImageData(land, 0, hz);

    sctx.drawImage(obj, 0, 0);
    grain();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, W, H);
  }

  var t = .3, frame = 0, aim = null, held = 0, queued = false;
  function redraw() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; draw(frame); });
  }
  // The pointer is the sun. Over the sky the pointer itself is hidden and the
  // sun shows in its place; over the ground the sun is set behind it, and the
  // pointer is a crosshair so it is not lost. A mouse keeps the sun until it
  // leaves the picture; a touch leaves it where it was put for a few seconds.
  function point(e) {
    var r = canvas.getBoundingClientRect();
    aim = { x: (e.clientX - r.left) / r.width * cols, y: (e.clientY - r.top) / r.height * rows };
    held = e.pointerType === 'touch' ? performance.now() + 4000 : Infinity;
    canvas.style.cursor = aim.y < hz ? 'none' : 'crosshair';
    redraw();
  }
  // Back to its arc, carrying on from the hour it was let go at.
  function letGo() {
    if (!aim) return;
    t = clamp((Math.floor(aim.x) / cols - .06) / .88);
    aim = null;
    redraw();
  }

  size();
  window.addEventListener('resize', function () { size(); draw(frame); });
  canvas.addEventListener('pointermove', point);
  canvas.addEventListener('pointerdown', point);
  canvas.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') letGo(); });
  bird.addEventListener('load', redraw);
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    t = .35;
    draw(frame);
  } else {
    setInterval(function () {
      if (aim && performance.now() > held) letGo();
      draw(frame);
      frame++;
      if (!aim) {
        t += 1 / 220;
        if (t >= 1) t = 0;
      }
    }, 100);
  }
})();
</script>
