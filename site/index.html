  <!-- The picture: the Sydney skyline in black under the sun, on a khaki
       ground; a pixel lorikeet on a rooftop at each end, hopping along it
       and now and then flying to another. The sun is the pointer's: it
       goes where the pointer goes over the picture, the sky takes the
       hour's colour, and every building throws its shadow on the ground
       away from it, short when it is high and long when it is low. Drawn
       as one SVG so it is sharp at any width: each building its own
       outline, with nothing inside it to show a seam, running on under the
       ground so no gap can open between them; each shadow the same outline
       sheared onto the ground and clipped to it. Each bird is a window onto
       one sheet of poses, moved from pose to pose by the script below. On a
       narrow screen the left end shows, where a bird is. -->
  <div class="picture">
    <svg viewBox="0 0 1582 583" preserveAspectRatio="xMinYMid slice" role="img" aria-label="A black Sydney skyline under the sun, on a strip of khaki ground, with pixel lorikeets hopping along the rooftops and flying between them; the sun follows the pointer and the buildings' shadows follow the sun">
      <defs><clipPath id="on-the-ground"><rect y="459" width="1582" height="124"/></clipPath></defs>
      <rect id="sky" width="1582" height="583" fill="#6bb9e7"/>
      <circle id="sun" cx="692" cy="89.5" r="50.5" fill="#f9da49"/>
      <g id="skyline" fill="#000">
      <path id="b0" d="M0 300h128v80h112v88h-240z"/>
      <path id="b1" d="M328 292v12h8v48h20v48h56v68h-156v-116h24v-48h8v-12z"/>
      <path id="b2" d="M476 88h12v60h16v4h4v16h-4v4h-8v8h24v28h-8v16h-16v244h-28v-244h-16v-12h-4v-4h-4v4h-4v-32h28v-8h-12v-24h20z"/>
      <path id="b3" d="M668 232v236h-136v-68h28v-32h40v-136z"/>
      <path id="b4" d="M956 204h68v36h8v148h28v80h-380v-100h40v-124h8v-16h36v-20h28v196h8v-64h24v-60h20v-4h12v-4h52v36h20v12h24v-80h4z"/>
      <path id="b5" d="M1068 248h68v92h16v128h-84z"/>
      <path id="b6" d="M1180 376h224v92h-224z"/>
      <path id="b7" d="M1456 224h80v16h16v228h-112v-16h-4v-212h20z"/>
      </g>
      <rect y="459" width="1582" height="124" fill="#d5cf9a"/>
      <g id="shadows" clip-path="url(#on-the-ground)" fill="#000" fill-opacity=".22">
      <use id="shadow-0" href="#b0" transform="matrix(1 0 0.9288 -0.1488 -426.33 527.32)"/>
      <use id="shadow-1" href="#b1" transform="matrix(1 0 0.5813 -0.1488 -266.83 527.32)"/>
      <use id="shadow-2" href="#b2" transform="matrix(1 0 0.3442 -0.1488 -158.01 527.32)"/>
      <use id="shadow-3" href="#b3" transform="matrix(1 0 0.1494 -0.1488 -68.57 527.32)"/>
      <use id="shadow-4" href="#b4" transform="matrix(1 0 -0.2890 -0.1488 132.67 527.32)"/>
      <use id="shadow-5" href="#b5" transform="matrix(1 0 -0.6788 -0.1488 311.55 527.32)"/>
      <use id="shadow-6" href="#b6" transform="matrix(1 0 -0.9743 -0.1488 447.20 527.32)"/>
      <use id="shadow-7" href="#b7" transform="matrix(1 0 -1.3023 -0.1488 597.76 527.32)"/>
      </g>
    <g id="bird-left"><svg x="33.2" y="222" width="116" height="84" viewBox="41 0 58 42" preserveAspectRatio="none"><image href="lorikeet-sheet.png" width="879" height="65"/></svg></g>
    <g id="bird-right" transform="translate(2957.6 0) scale(-1 1)"><svg x="1438.8" y="138" width="80" height="106" viewBox="0 0 40 53" preserveAspectRatio="none"><image href="lorikeet-sheet.png" width="879" height="65"/></svg></g>

<script>
/* The birds move the way lorikeets do. On a roof: a short hop, a pause of a
   second or two, another; round at the roof's edge or on a whim; through
   some hops the wings come out. Every so often a bird flies to another
   rooftop: it takes off, crosses over the skyline, and lands on a roof
   the other bird is not on.

   Every pose is a cell of one sheet, lorikeet-sheet.png, at the bird's own
   pixels, shown at two picture units a pixel. The perched bird is the
   drawing supplied; the take-off and the landing are the frames of the two
   animations supplied, each with the place the artist drew it in, relative
   to the perched bird, so the rise and the approach are theirs; the cruise
   loops the four airborne wing positions from the take-off. The sheet
   faces right and is mirrored for a bird going left.

   The sun is the pointer's. Over the picture it goes where the pointer
   goes, easing after it; off the picture it drifts back to where it was
   drawn. The sky takes the hour's colour, pale at sunrise, blue at noon,
   red at sunset. Every building throws its shadow on the ground: the same
   outline sheared away from the sun, as far as the sun is low, clipped to
   the ground. Picture units throughout, so it all scales with the picture.
   Still when motion is asked to be reduced: the birds as drawn; the sun
   still follows the pointer, since that is the reader's own hand. */
(function () {
  var K = 2;                         // picture units a pixel
  var FEET = { x: 24.9, y: 43 };     // where the perched bird's feet are, in its cell
  // Each cell: left, top, width, height on the sheet; where its top left
  // sits relative to the perched bird's, in pixels; how long it holds.
  var CELL = {
    perched: [0, 0, 40, 53, 0, 0, 0],
    up1: [41, 0, 58, 42, -5, 4, 170],
    up2: [100, 0, 63, 65, 2, -24, 120],
    up3: [164, 0, 65, 63, 0, -35, 80],
    up4: [230, 0, 65, 43, 6, -23, 80],
    up5: [296, 0, 70, 44, 13, -30, 80],
    up6: [367, 0, 63, 52, 27, -54, 80],
    down5: [431, 0, 65, 43, -54, -27, 80],
    down6: [497, 0, 70, 44, -40, -15, 80],
    down7: [568, 0, 63, 65, -24, -31, 140],
    down8: [632, 0, 63, 65, -26, -22, 120],
    down9: [696, 0, 63, 65, -28, -14, 100],
    down10: [760, 0, 59, 47, -14, 7, 140],
    down11: [820, 0, 59, 47, -14, 5, 150]
  };
  var TAKEOFF = ['up1', 'up2', 'up3', 'up4', 'up5', 'up6'];
  var BEAT = ['up3', 'up4', 'up5', 'up6'];
  var LANDING = ['down5', 'down6', 'down7', 'down8', 'down9', 'down10', 'down11'];
  // The roofs a bird can stand on: the roof line, and how far along it the
  // feet may go. Found on the skyline's outline; the narrow ones are left out.
  var ROOFS = [
    { y: 300, from: 14, to: 114 },
    { y: 380, from: 142, to: 226 },
    { y: 232, from: 614, to: 654 },
    { y: 204, from: 970, to: 1010 },
    { y: 248, from: 1082, to: 1122 },
    { y: 376, from: 1194, to: 1390 },
    { y: 224, from: 1470, to: 1522 }
  ];
  var BIRDS = [
    { id: 'bird-left',  roof: 0, x: 93,   facing: 1 },
    { id: 'bird-right', roof: 6, x: 1469, facing: -1 }
  ];
  var SPEED = .3, STEP = 80, HIGHEST = 150;   // picture units a millisecond; ms a wing position; the cruising height
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function ease(p) { return p * p * (3 - 2 * p); }

  // -- the birds ---------------------------------------------------------------
  function show(b, name, x, y, mirrored) {
    var c = CELL[name], w = c[2] * K, h = c[3] * K;
    b.win.setAttribute('viewBox', c[0] + ' ' + c[1] + ' ' + c[2] + ' ' + c[3]);
    b.win.setAttribute('width', w); b.win.setAttribute('height', h);
    b.win.setAttribute('x', x); b.win.setAttribute('y', y);
    b.node.setAttribute('transform', mirrored ? 'translate(' + (2 * x + w) + ' 0) scale(-1 1)' : '');
  }
  // A cell in the artist's place relative to a perch: feet at (px, py).
  function posed(b, name, px, py, lift) {
    var c = CELL[name], m = b.facing < 0;
    var x = m ? px + K * FEET.x - K * (c[4] + c[2]) : px - K * FEET.x + K * c[4];
    show(b, name, x, py - K * FEET.y + K * c[5] - (lift || 0), m);
  }
  // A cell with its middle at (cx, cy): the airborne poses.
  function centred(b, name, cx, cy) {
    var c = CELL[name];
    show(b, name, cx - c[2] * K / 2, cy - c[3] * K / 2, b.facing < 0);
  }
  function middleOf(b, name, px, py) {
    var c = CELL[name], m = b.facing < 0;
    var x = m ? px + K * FEET.x - K * (c[4] + c[2]) : px - K * FEET.x + K * c[4];
    return { x: x + c[2] * K / 2, y: py - K * FEET.y + K * c[5] + c[3] * K / 2 };
  }
  function sit(b, now, wait) { b.act = 'rest'; b.until = now + wait; posed(b, 'perched', b.x, ROOFS[b.roof].y); }
  function frameAt(names, t) {
    for (var i = 0; i < names.length; i++) { t -= CELL[names[i]][6]; if (t < 0) return names[i]; }
    return null;
  }

  function hopOrTurn(b, now) {
    var roof = ROOFS[b.roof];
    var atEdge = (b.facing < 0 && b.x <= roof.from + 4) || (b.facing > 0 && b.x >= roof.to - 4);
    if (atEdge || Math.random() < .18) { b.facing = -b.facing; sit(b, now, rand(350, 950)); return; }
    b.act = 'hop'; b.t0 = now; b.dur = rand(320, 440);
    b.x0 = b.x; b.x1 = Math.min(roof.to, Math.max(roof.from, b.x + rand(18, 58) * b.facing));
    b.high = rand(14, 32); b.flutter = Math.random() < .4;
  }
  function hop(b, now) {
    var p = Math.min(1, (now - b.t0) / b.dur);
    b.x = b.x0 + (b.x1 - b.x0) * p;
    posed(b, (b.flutter && p > .15 && p < .85) ? 'up1' : 'perched', b.x, ROOFS[b.roof].y, 4 * b.high * p * (1 - p));
    if (p >= 1) sit(b, now, rand(500, 2700));
  }

  // A roof to fly to: not this one, not the other bird's or the one it is
  // flying to, and well away from here when there is such a roof.
  function pick(b) {
    var other = BIRDS[b === BIRDS[0] ? 1 : 0], far = [], any = [], i, mid;
    for (i = 0; i < ROOFS.length; i++) {
      if (i === b.roof || i === other.roof) continue;
      any.push(i);
      mid = (ROOFS[i].from + ROOFS[i].to) / 2;
      if (Math.abs(mid - b.x) >= 250) far.push(i);
    }
    var from = far.length ? far : any;
    return from.length ? from[Math.floor(Math.random() * from.length)] : -1;
  }
  function takeOff(b, now) {
    var to = pick(b);
    if (to < 0) { b.flyAt = now + rand(4000, 9000); hopOrTurn(b, now); return; }
    b.act = 'takeoff'; b.t0 = now;
    b.px = b.x; b.py = ROOFS[b.roof].y;                       // the perch left
    b.roof = to; b.x = rand(ROOFS[to].from + 6, ROOFS[to].to - 6); b.qy = ROOFS[to].y;
    b.facing = b.x > b.px ? 1 : -1;
    b.from = middleOf(b, 'up6', b.px, b.py);
    b.to = middleOf(b, 'down5', b.x, b.qy);
    b.cruise = Math.min(HIGHEST, b.from.y, b.to.y);
    b.dur = Math.max(900, Math.abs(b.to.x - b.from.x) / SPEED);
  }
  function fly(b, now) {
    var name, p, q, up, down;
    if (b.act === 'takeoff') {
      name = frameAt(TAKEOFF, now - b.t0);
      if (name) { posed(b, name, b.px, b.py); return; }
      b.act = 'cruise'; b.t0 = now;
    }
    if (b.act === 'cruise') {
      p = Math.min(1, (now - b.t0) / b.dur); q = ease(p);
      up = p < .2 ? ease(p / .2) : 1; down = p > .8 ? ease((p - .8) / .2) : 0;
      centred(b, BEAT[Math.floor((now - b.t0) / STEP) % BEAT.length],
        b.from.x + (b.to.x - b.from.x) * q,
        b.from.y + (b.cruise - b.from.y) * up + (b.to.y - b.cruise) * down + Math.sin((now - b.t0) / 420) * 9 * up * (1 - down));
      if (p < 1) return;
      b.act = 'landing'; b.t0 = now;
    }
    name = frameAt(LANDING, now - b.t0);
    if (name) { posed(b, name, b.x, b.qy); return; }
    b.flyAt = now + rand(9000, 24000);
    sit(b, now, rand(700, 1800));
  }
  function birds(now) {
    for (var i = 0; i < BIRDS.length; i++) {
      var b = BIRDS[i];
      if (b.act === 'hop') hop(b, now);
      else if (b.act === 'takeoff' || b.act === 'cruise' || b.act === 'landing') fly(b, now);
      else if (now >= b.until) { if (now >= b.flyAt) takeOff(b, now); else hopOrTurn(b, now); }
    }
  }

  // -- the sun, the sky and the shadows ----------------------------------------------
  var picture = document.querySelector('.picture svg');
  var sun = document.getElementById('sun'), sky = document.getElementById('sky');
  var SHADOWS = [120, 334, 480, 600, 870, 1110, 1292, 1494].map(function (cx, i) { return { cx: cx, node: document.getElementById('shadow-' + i) }; });
  var WIDE = 1582, GROUND = 459;
  var HOME = { x: 692, y: 89.5 };
  var at = { x: HOME.x, y: HOME.y }, want = { x: HOME.x, y: HOME.y }, lit = false;
  // The sky through the day: the hour, and its colour; the mock-up's blue
  // at noon, pale at sunrise, red at sunset.
  var DAY = [
    [0, [255, 255, 195]], [.14, [255, 255, 195]], [.24, [222, 237, 245]], [.34, [107, 185, 231]],
    [.66, [107, 185, 231]], [.72, [224, 238, 245]], [.77, [247, 214, 180]], [.83, [255, 160, 95]],
    [.89, [255, 88, 40]], [1, [255, 88, 40]]
  ];
  function skyAt(hour) {
    var i = 1;
    while (i < DAY.length - 1 && hour > DAY[i][0]) i++;
    var a = DAY[i - 1], b = DAY[i], f = ease(Math.min(Math.max((hour - a[0]) / (b[0] - a[0]), 0), 1));
    return 'rgb(' + [0, 1, 2].map(function (k) { return Math.round(a[1][k] + (b[1][k] - a[1][k]) * f); }).join(',') + ')';
  }
  function light() {
    var dx = want.x - at.x, dy = want.y - at.y;
    if (Math.abs(dx) < .05 && Math.abs(dy) < .05) { if (!lit) return; lit = false; at.x = want.x; at.y = want.y; }
    else { lit = true; at.x += dx * .12; at.y += dy * .12; }
    sun.setAttribute('cx', at.x); sun.setAttribute('cy', at.y);
    sky.setAttribute('fill', skyAt(at.x / WIDE));
    // The shadow: the outline sheared away from the sun and flattened onto
    // the ground, (x, y) -> (x + s (G - y), G + d (G - y)).
    var high = Math.max(24, GROUND - at.y), d = Math.min(1.2, Math.max(.1, 55 / high));
    for (var i = 0; i < SHADOWS.length; i++) {
      var s = Math.max(-3, Math.min(3, .6 * (SHADOWS[i].cx - at.x) / high));   // no further than three to one
      SHADOWS[i].node.setAttribute('transform', 'matrix(1 0 ' + (-s) + ' ' + (-d) + ' ' + (GROUND * s) + ' ' + (GROUND * (1 + d)) + ')');
    }
  }
  function place(e) {
    var p = picture.createSVGPoint(), m = picture.getScreenCTM();
    if (!m) return;
    p.x = e.clientX; p.y = e.clientY; p = p.matrixTransform(m.inverse());
    want.x = Math.min(Math.max(p.x, 0), WIDE); want.y = Math.min(Math.max(p.y, 30), GROUND - 20);
  }
  picture.addEventListener('pointermove', place);
  picture.addEventListener('pointerdown', place);
  picture.addEventListener('pointerleave', function () { want.x = HOME.x; want.y = HOME.y; });

  // -- the frames -------------------------------------------------------------------
  function step(now) {
    if (!still) birds(now);
    light();
    window.requestAnimationFrame(step);
  }
  for (var i = 0; i < BIRDS.length; i++) {
    BIRDS[i].node = document.getElementById(BIRDS[i].id);
    BIRDS[i].win = BIRDS[i].node && BIRDS[i].node.querySelector('svg');
  }
  if (!window.requestAnimationFrame || !BIRDS[0].win || !BIRDS[1].win || !sun || !sky) return;
  var start = window.performance && performance.now ? performance.now() : Date.now();
  BIRDS[0].act = 'rest'; BIRDS[0].until = start + 1200; BIRDS[0].flyAt = start + rand(8000, 16000);   // left as drawn: wings half out
  BIRDS[1].act = 'rest'; BIRDS[1].until = start + 2100; BIRDS[1].flyAt = start + rand(14000, 26000); posed(BIRDS[1], 'perched', BIRDS[1].x, ROOFS[BIRDS[1].roof].y);
  window.requestAnimationFrame(step);
})();
</script>
