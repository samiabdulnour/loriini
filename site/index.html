<script>
/* The front's pixel sun study. A sun crosses the grid from 09:00 to 15:00,
   three buildings cast shadows whose length follows its height, and once a
   loop the lorikeet flaps across. Chunky on purpose: 8 frames a second. */
(function () {
  var canvas = document.getElementById('sunbox');
  var clock = document.getElementById('sunclock');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');

  var C = {
    field: '#2e2d2a', grid: '#3a3934', ground: '#232220', shadow: '#0e0d0b',
    sun: '#ffc81e', sunCore: '#ff8a1f',
    blue: '#1a5fd0', green: '#8fc07c', pink: '#ef7bd8', red: '#e8521a',
    cyan: '#35b6d9', cream: '#e9e6dc'
  };

  var cell, cols, rows, ground;
  function size() {
    var r = canvas.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.max(22, Math.round(r.width / 26));
    cell = r.width / cols;
    rows = Math.ceil(r.height / cell);
    ground = rows - 2;
  }

  function px(x, y, colour) {
    ctx.fillStyle = colour;
    ctx.fillRect(x * cell, y * cell, cell + .5, cell + .5);
  }

  // Three buildings: x from the left edge in grid cells, width, height.
  var buildings = [
    { x: .14, w: 3, h: 5, colour: C.red },
    { x: .40, w: 2, h: 9, colour: C.blue },
    { x: .68, w: 4, h: 4, colour: C.pink }
  ];

  var t = 0, bird = null, loops = 0;

  function frame() {
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    ctx.fillStyle = C.field;
    ctx.fillRect(0, 0, w, h);

    // The grid itself.
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i <= cols; i++) { ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, h); }
    for (var j = 0; j <= rows; j++) { ctx.moveTo(0, j * cell); ctx.lineTo(w, j * cell); }
    ctx.stroke();

    // Ground.
    for (var g = 0; g < cols; g++) { px(g, ground + 1, C.ground); px(g, ground + 2, C.ground); }

    // The sun: an arc from the left edge to the right.
    var sx = Math.round(1 + t * (cols - 5));
    var elev = Math.sin(Math.PI * t);
    var sy = Math.round(ground - 3 - elev * (ground - 5));

    // The sun first, so it rises and sets behind the skyline: a 2×2 block
    // with an orange heart and four blinking rays.
    px(sx, sy, C.sun); px(sx + 1, sy, C.sun); px(sx, sy + 1, C.sun); px(sx + 1, sy + 1, C.sunCore);
    if (Math.floor(t * 40) % 2) {
      px(sx - 1, sy, C.sun); px(sx + 2, sy + 1, C.sun);
    } else {
      px(sx, sy - 1, C.sun); px(sx + 1, sy + 2, C.sun);
    }

    // Shadows next, so the buildings sit on top of their own.
    buildings.forEach(function (b) {
      var bx = Math.round(b.x * cols);
      var dir = (sx <= bx + b.w / 2) ? 1 : -1;
      var len = Math.max(1, Math.round(b.h * (1.4 - elev * 1.25)));
      var from = dir > 0 ? bx + b.w : bx - 1;
      for (var s = 0; s < len; s++) {
        var x = from + dir * s;
        if (x >= 0 && x < cols) { px(x, ground, C.shadow); px(x, ground + 1, C.shadow); }
      }
    });

    // Buildings, each with one lit cream window.
    buildings.forEach(function (b, k) {
      var bx = Math.round(b.x * cols);
      for (var x = 0; x < b.w; x++)
        for (var y = 0; y < b.h; y++)
          px(bx + x, ground - y, b.colour);
      px(bx + (k % b.w), ground - 1 - (k % (b.h - 1)), C.cream);
    });

    // The lorikeet: three feathers flapping across, once a loop.
    if (!bird && t < .02) bird = { x: cols + 1, y: 3 + (loops % 3) * 2 };
    if (bird) {
      var flap = Math.floor(bird.x) % 2;
      px(bird.x, bird.y, C.red); px(bird.x + 1, bird.y - flap, C.blue); px(bird.x + 2, bird.y, C.green);
      bird.x -= .6;
      if (bird.x < -3) bird = null;
    }

    if (clock) {
      var mins = 540 + Math.round(t * 360); // 09:00 + six hours
      var hh = Math.floor(mins / 60), mm = mins % 60;
      clock.textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    }

    t += 1 / 160; // a 20-second day at 8 fps
    if (t >= 1) { t = 0; loops++; }
  }

  size();
  window.addEventListener('resize', function () { size(); frame(); });
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    t = .35; frame();
  } else {
    frame();
    setInterval(frame, 125);
  }
})();
</script>
</body>
</html>
