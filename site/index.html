<!-- The front is the name over the picture: the towers and the lorikeet
     under the sun, their shadows on the ground. Everything said in words
     lives on its own page, one per tab above. -->
<main class="wrap wide front">
  <h1 class="name">Loriini</h1>
  <p class="unseen">Sun studies from Archicad, for a NSW DA.</p>
  <div class="picture">
    <canvas id="picture" role="img" aria-label="Five black towers and a pixel lorikeet on the ground under the sun, the sky pale at sunrise, blue at noon and red at sunset; the sun follows the pointer and the shadows turn and stretch in front of them"></canvas>
  </div>

<script>
/* The front's picture: five black towers and the lorikeet on the ground,
   the sun crossing behind them and their shadows falling on the ground in
   front of them. The sky, the sun, the ground, the towers and the shadows
   are drawn as shapes at the screen's own resolution; only the lorikeet
   keeps its pixels, each scaled up whole, and its shadow is its own
   silhouette laid on the ground, pixels and all.

   The sky runs down to the towers' feet, the ground a strip in front of
   them. It takes the hour's colour: pale at sunrise, blue at noon, red at
   sunset, with three bands of glow round the sun, a plain yellow disc,
   spreading wide at sunrise and sunset; and its light colours the ground,
   the shadows and the bird a little. The sun keeps to the day's arc on its
   own; the pointer takes it, always behind the towers, the bird and the
   ground, and the shadows follow it: short when it is high, long when it is
   low, thrown away from its side. */
(function () {
  var box = document.querySelector('.picture');
  var canvas = document.getElementById('picture');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  // The bird in the sky's light, turned to face left, and its silhouette.
  var sprite = document.createElement('canvas'), pctx = sprite.getContext('2d', { willReadFrequently: true });
  var shape = document.createElement('canvas'), hctx = shape.getContext('2d');
  var bird = new Image();
  bird.src = 'lorikeet.png';

  var C = { tower: '#000', sun: '#ffd900' };
  var GROUND = [214, 207, 147], SHADE = [184, 184, 184];
  // The sky through the day, as the hour and the sky's colour with the glow
  // nearest the sun: sunrise, noon and sunset from the design, held a while
  // each. Between them the sky passes through a pale, nearly white sky, then
  // in the evening an apricot and an orange, so each step blends two
  // neighbouring colours: no green between the yellow and the blue, no grey
  // or purple between the blue and the red.
  var DAY = [
    [0, [255, 255, 195], [255, 228, 80]],
    [.14, [255, 255, 195], [255, 228, 80]],
    [.24, [222, 237, 245], [255, 250, 225]],
    [.34, [76, 187, 236], [205, 236, 248]],
    [.66, [76, 187, 236], [205, 236, 248]],
    [.72, [224, 238, 245], [255, 252, 238]],
    [.77, [247, 214, 180], [255, 244, 215]],
    [.83, [255, 160, 95], [255, 222, 135]],
    [.89, [255, 88, 40], [255, 198, 55]],
    [1, [255, 88, 40], [255, 198, 55]]
  ];
  // How far the sky's light colours the ground, the shadows and the bird.
  var TINT = .22;

  // The scene, as shares of a frame 70 cells high and 189 wide: where the
  // towers and the bird stand, which is where the sky meets the ground, and
  // the towers' edges and tops. A narrower picture shows the middle of it,
  // round the bird.
  var ROWS = 70, WIDE = 189, BASE = .78, FOCUS = .56;
  var TOWERS = [[0, .128, .436], [.169, .296, .358], [.372, .45, .358], [.651, .778, .358], [.859, .987, .358]];
  var BIRD_AT = .475;

  function clamp(v) { return Math.min(Math.max(v, 0), 1); }
  function smooth(a, b, v) { v = clamp((v - a) / (b - a)); return v * v * (3 - 2 * v); }
  function mix(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
  // The sky for the hour: the three bands of glow from the sun outwards, the
  // sky itself, and the light it casts, the sky's colour at its brightest.
  function skyFor(hour) {
    var i = 1;
    while (i < DAY.length - 1 && hour > DAY[i][0]) i++;
    var a = DAY[i - 1], b = DAY[i], f = smooth(a[0], b[0], hour);
    var sky = mix(a[1], b[1], f), glow = mix(a[2], b[2], f), top = Math.max(sky[0], sky[1], sky[2]);
    return {
      bands: [0, 1, 2, 3].map(function (k) { return mix(glow, sky, k / 3).map(Math.round); }),
      light: sky.map(function (v) { return 1 - TINT + TINT * v / top; })
    };
  }
  function lit(c, light) { return [c[0] * light[0], c[1] * light[1], c[2] * light[2]]; }

  // Smooth noise, for the bands' uneven edges.
  var perm = [];
  for (var i = 0; i < 256; i++) perm[i] = i;
  for (i = 255; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), sw = perm[i]; perm[i] = perm[j]; perm[j] = sw; }
  function lattice(x, y) { return perm[(perm[x & 255] + y) & 255] / 255; }
  function noise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi;
    u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
    var a = lattice(xi, yi), b = lattice(xi + 1, yi), c = lattice(xi, yi + 1), d = lattice(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // The scene is laid out in cells, 70 to the picture's height, the
  // lorikeet's pixels; each shape is drawn in those units, scaled to the
  // screen.
  var W, H, dpr, cols, rows, off, hz, base;
  function size() {
    var r = box.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    rows = ROWS;
    cols = Math.max(1, Math.round(W / (H / rows)));
    off = cols >= WIDE ? (WIDE - cols) / 2 : Math.min(Math.max(FOCUS * WIDE - cols / 2, 0), WIDE - cols);
    base = hz = BASE * rows;
  }
  function at(share) { return share * WIDE - off; }
  function css(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }

  // The lorikeet in the sky's light: warmer at sunrise and sunset, a little
  // cooler at noon. And its silhouette, in the shadow's colour.
  function paintBird(light, shade) {
    var bw = bird.naturalWidth, bh = bird.naturalHeight;
    if (sprite.width !== bw) { sprite.width = shape.width = bw; sprite.height = shape.height = bh; }
    pctx.clearRect(0, 0, bw, bh);
    pctx.save(); pctx.translate(bw, 0); pctx.scale(-1, 1); pctx.drawImage(bird, 0, 0); pctx.restore();
    var img = pctx.getImageData(0, 0, bw, bh), a = img.data;
    for (var i = 0; i < a.length; i += 4) { a[i] *= light[0]; a[i + 1] *= light[1]; a[i + 2] *= light[2]; }
    pctx.putImageData(img, 0, 0);
    hctx.globalCompositeOperation = 'source-over';
    hctx.clearRect(0, 0, bw, bh);
    hctx.drawImage(sprite, 0, 0);
    hctx.globalCompositeOperation = 'source-in';
    hctx.fillStyle = css(shade);
    hctx.fillRect(0, 0, bw, bh);
  }

  // A band of glow: a disc whose edge wavers a little and drifts.
  function glow(x, y, r, band, drift, colour) {
    ctx.beginPath();
    for (var i = 0; i <= 72; i++) {
      var a = i / 72 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      var rr = r * (1 + (noise(c * 1.4 + drift + band * 5, s * 1.4 + band * 5) - .5) * .12);
      if (i) ctx.lineTo(x + c * rr, y + s * rr); else ctx.moveTo(x + c * rr, y + s * rr);
    }
    ctx.fillStyle = colour;
    ctx.fill();
  }

  function draw(frame) {
    var ready = bird.complete && bird.naturalWidth;
    ctx.setTransform(dpr * W / cols, 0, 0, dpr * H / rows, 0, 0);

    // Where the sun stands. On its own it keeps to the day's arc across the
    // picture for the hour t; as the pointer it stands where the pointer is,
    // and the hour and its height are read back from there.
    var R = rows * .087, low = hz - R, span = low - R - 2, sun;
    if (!aim) {
      var e = Math.sin(Math.PI * t);
      sun = { x: cols * (.06 + .88 * t), y: low - e * span, elev: e, hour: t };
    } else {
      sun = { x: aim.x, y: aim.y, elev: clamp((low - aim.y) / span), hour: clamp((aim.x / cols - .06) / .88) };
    }

    // The sky, with its three bands of glow round the sun: tight round it
    // at noon, spreading wide at sunrise and sunset. Then the sun, a plain
    // yellow disc; the ground, drawn next, hides it when it is down.
    var dusk = smooth(.2, .5, Math.abs(sun.hour - .5));
    var day = skyFor(sun.hour), step = R * (.37 + 1.6 * dusk), drift = frame * .015;
    ctx.fillStyle = css(day.bands[3]);
    ctx.fillRect(0, 0, cols, hz);
    for (var k = 3; k >= 1; k--) glow(sun.x, sun.y, R + k * step, k, drift, css(day.bands[k - 1]));
    ctx.beginPath(); ctx.arc(sun.x, sun.y, R, 0, Math.PI * 2);
    ctx.fillStyle = C.sun; ctx.fill();

    // The ground, and the shadows on it. A point h cells above the ground
    // falls h * shy cells in front of the figures and h * shx across.
    var ground = lit(GROUND, day.light), shade = lit(SHADE, day.light);
    ctx.fillStyle = css(ground);
    ctx.fillRect(0, hz, cols, rows - hz);
    var ang = .1 + sun.elev * 1.35;
    var L = Math.min(2.4, Math.cos(ang) / Math.sin(ang));
    var shy = .55 * L, shx = -(sun.hour - .5) * 1.6 * L;
    var bw = ready ? bird.naturalWidth : 0, bh = ready ? bird.naturalHeight : 0;
    var bx = Math.round(at(BIRD_AT)), by = Math.round(base - bh * .82) - (frame % 23 < 2 ? 1 : 0);
    if (ready) paintBird(day.light, shade);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, base, cols, rows - base); ctx.clip();
    ctx.fillStyle = css(shade);
    TOWERS.forEach(function (tw) {
      var x0 = at(tw[0]), x1 = at(tw[1]), h = base - tw[2] * rows;
      ctx.beginPath();
      ctx.moveTo(x0, base); ctx.lineTo(x1, base);
      ctx.lineTo(x1 + h * shx, base + h * shy); ctx.lineTo(x0 + h * shx, base + h * shy);
      ctx.fill();
    });
    // The bird's shadow: its silhouette, each pixel laid on the ground by the
    // same rule, so it slants and stretches as the towers' do.
    if (ready) {
      ctx.transform(1, 0, -shx, -shy, bx + (base - by) * shx, base + (base - by) * shy);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(shape, 0, 0);
    }
    ctx.restore();

    // The towers, and the lorikeet in front, turned to face left, its feet on
    // the ground with the towers', hopping now and then.
    ctx.fillStyle = C.tower;
    TOWERS.forEach(function (tw) {
      var x0 = at(tw[0]), top = tw[2] * rows;
      ctx.fillRect(x0, top, at(tw[1]) - x0, base - top);
    });
    if (ready) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite, bx, by, bw, bh);
    }
  }

  var t = .3, frame = 0, aim = null, held = 0, queued = false;
  function redraw() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; draw(frame); });
  }
  // The pointer is the sun. Over the sky the pointer itself is hidden and the
  // sun shows in its place; over the ground the sun is set behind it, and the
  // pointer is a crosshair so it is not lost. A mouse keeps the sun until it
  // leaves the picture; a touch leaves it where it was put for a few seconds.
  function point(e) {
    var r = canvas.getBoundingClientRect();
    aim = { x: (e.clientX - r.left) / r.width * cols, y: (e.clientY - r.top) / r.height * rows };
    held = e.pointerType === 'touch' ? performance.now() + 4000 : Infinity;
    canvas.style.cursor = aim.y < hz ? 'none' : 'crosshair';
    redraw();
  }
  // Back to its arc, carrying on from the hour it was let go at.
  function letGo() {
    if (!aim) return;
    t = clamp((aim.x / cols - .06) / .88);
    aim = null;
    redraw();
  }

  size();
  window.addEventListener('resize', function () { size(); draw(frame); });
  canvas.addEventListener('pointermove', point);
  canvas.addEventListener('pointerdown', point);
  canvas.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') letGo(); });
  bird.addEventListener('load', redraw);
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    t = .35;
    draw(frame);
  } else {
    setInterval(function () {
      if (aim && performance.now() > held) letGo();
      draw(frame);
      frame++;
      if (!aim) {
        t += 1 / 220;
        if (t >= 1) t = 0;
      }
    }, 100);
  }
})();
</script>
