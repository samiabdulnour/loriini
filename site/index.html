<script>
/* The birds move the way lorikeets do. On a roof: a short hop, a pause of a
   second or two, another; round at the roof's edge or on a whim; through
   some hops the wings open. Every so often the two swap towers: one takes
   off, the other a moment later, and they cross over the skyline, flapping,
   and land on the other's roof.

   Three sprites: perched, wings out, and in flight; each is mirrored to
   face the way the bird is going. Sizes are read from the files, so a
   sprite can be swapped for another without touching this. Without the
   flying frame (lorikeet-flying.png) the birds hop and keep to their
   towers. Picture units throughout, so it all scales with the picture.
   Still when motion is asked to be reduced: the mock-up as drawn. */
(function () {
  // Each sprite: which way it faces as drawn, the point of it that stands
  // on the roof line as shares of its width and height, and how many
  // picture units each of its pixels is shown at.
  var SPRITE = {
    perched: { href: 'lorikeet-perched.png', faces: 1,  ax: .622, ay: .811, scale: 2 },
    wings:   { href: 'lorikeet-wings.png',   faces: 1,  ax: .663, ay: .885 },
    flying:  { href: 'lorikeet-flying.png',  faces: 1,  ax: .5,   ay: .78 }
  };
  // The two roofs: the roof line, and how far along it a bird's feet may go.
  var ROOF = [{ y: 301, from: 64, to: 120 }, { y: 230, from: 1462, to: 1528 }];
  var BIRDS = [
    { id: 'bird-left',  roof: 0, x: 93,   facing: 1,  sprite: 'wings' },
    { id: 'bird-right', roof: 1, x: 1469, facing: -1, sprite: 'perched' }
  ];
  var CRUISE = 150, SPEED = .3, FLAP = 160;   // height, picture units a millisecond, ms a wingbeat
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function ease(p) { return p * p * (3 - 2 * p); }

  function place(b, x, y) {
    var s = SPRITE[b.sprite], mirrored = b.facing !== s.faces;
    var left = x - s.w * (mirrored ? 1 - s.ax : s.ax), top = y - s.h * s.ay;
    b.node.setAttribute('href', s.href);
    b.node.setAttribute('width', s.w); b.node.setAttribute('height', s.h);
    b.node.setAttribute('x', left); b.node.setAttribute('y', top);
    b.node.setAttribute('transform', mirrored ? 'translate(' + (2 * left + s.w) + ' 0) scale(-1 1)' : '');
  }
  function sit(b, now, wait) { b.act = 'rest'; b.until = now + wait; b.sprite = 'perched'; place(b, b.x, ROOF[b.roof].y); }

  function hopOrTurn(b, now) {
    var roof = ROOF[b.roof];
    var atEdge = (b.facing < 0 && b.x <= roof.from + 4) || (b.facing > 0 && b.x >= roof.to - 4);
    if (atEdge || Math.random() < .18) { b.facing = -b.facing; sit(b, now, rand(350, 950)); return; }
    b.act = 'hop'; b.t0 = now; b.dur = rand(320, 440);
    b.x0 = b.x; b.x1 = Math.min(roof.to, Math.max(roof.from, b.x + rand(18, 58) * b.facing));
    b.high = rand(14, 32); b.flutter = Math.random() < .4;
  }
  function takeOff(b, now) {
    var to = ROOF[1 - b.roof];
    b.act = 'fly'; b.t0 = now; b.x0 = b.x; b.y0 = ROOF[b.roof].y;
    b.x1 = rand(to.from + 8, to.to - 8); b.y1 = to.y;
    b.dur = Math.abs(b.x1 - b.x0) / SPEED;
    b.facing = b.x1 > b.x0 ? 1 : -1; b.roof = 1 - b.roof;
  }
  function fly(b, now) {
    var p = Math.min(1, (now - b.t0) / b.dur), q = ease(p);
    var x = b.x0 + (b.x1 - b.x0) * q;
    // Up from the roof over the first fifth, level with a bob, down over the last.
    var up = p < .2 ? ease(p / .2) : 1, down = p > .8 ? ease((p - .8) / .2) : 0;
    var y = b.y0 + (CRUISE - b.y0) * up + (b.y1 - CRUISE) * down + Math.sin(p * b.dur / 420) * 9 * up * (1 - down);
    b.sprite = p > .9 ? 'wings' : (Math.floor((now - b.t0) / FLAP) % 2 ? 'wings' : 'flying');
    place(b, x, y);
    if (p >= 1) { b.x = b.x1; sit(b, now, rand(700, 1800)); }
  }

  var swapAt = 0, flown = 0, canFly = true;
  function step(now) {
    var i, b;
    if (!swapAt) swapAt = now + rand(9000, 20000);
    for (i = 0; i < BIRDS.length; i++) {
      b = BIRDS[i];
      if (b.act === 'hop') {
        var p = Math.min(1, (now - b.t0) / b.dur);
        b.x = b.x0 + (b.x1 - b.x0) * p;
        b.sprite = (b.flutter && p > .15 && p < .85) ? 'wings' : 'perched';
        place(b, b.x, ROOF[b.roof].y - 4 * b.high * p * (1 - p));
        if (p >= 1) sit(b, now, rand(500, 2700));
      } else if (b.act === 'fly') {
        fly(b, now);
      } else if (now >= b.until) {
        // The swap: the first bird to be ready goes, the second once it is
        // airborne, so neither lands on an occupied roof.
        if (canFly && now >= swapAt && flown < 2 && (flown === 0 || BIRDS[1 - i].act === 'fly' && now - BIRDS[1 - i].t0 > 500)) {
          takeOff(b, now); flown++;
          if (flown === 2) { swapAt = now + rand(12000, 26000); flown = 0; }
        } else {
          hopOrTurn(b, now);
        }
      }
    }
    window.requestAnimationFrame(step);
  }

  var waiting = 0;
  function loaded(name, img, ok) {
    if (ok) { var k = SPRITE[name].scale || 1; SPRITE[name].w = img.naturalWidth * k; SPRITE[name].h = img.naturalHeight * k; }
    else if (name === 'flying') { canFly = false; }
    if (--waiting === 0) begin();
  }
  function begin() {
    var start = window.performance && performance.now ? performance.now() : Date.now();
    for (var i = 0; i < BIRDS.length; i++) { BIRDS[i].act = 'rest'; BIRDS[i].until = start + 1200 + i * 900; }
    place(BIRDS[0], BIRDS[0].x, ROOF[0].y); place(BIRDS[1], BIRDS[1].x, ROOF[1].y);
    window.requestAnimationFrame(step);
  }

  for (var i = 0; i < BIRDS.length; i++) BIRDS[i].node = document.getElementById(BIRDS[i].id);
  if (still || !window.requestAnimationFrame || !BIRDS[0].node || !BIRDS[1].node) return;
  Object.keys(SPRITE).forEach(function (name) {
    var img = new Image();
    waiting++;
    img.onload = function () { loaded(name, img, true); };
    img.onerror = function () { loaded(name, img, false); };
    img.src = SPRITE[name].href;
  });
})();
</script>
